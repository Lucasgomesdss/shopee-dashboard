<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main style="max-width:400px;margin:60px auto;padding:0 16px;">
    <div class="card">
      <h2>📦 Separação de Pedidos</h2>
      <p class="muted">Escolha seu usuário e digite a senha para entrar.</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
      {% endwith %}
      <form method="post">
        <select name="username" required style="width:100%;font-size:1.3rem;padding:14px;border:2px solid #ddd;border-radius:10px;margin-bottom:12px;">
          <option value="" disabled selected>Selecione seu usuário</option>
          {% for u in users %}
            <option value="{{ u }}">{{ u }}</option>
          {% endfor %}
        </select>
        <input type="password" name="password" placeholder="Senha" required>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
